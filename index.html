<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KharchBook</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
</head>
<body>

  <!-- Top bar with app name -->
  <header class="app-header">
    <button id="menu-btn" class="menu-icon-btn">☰</button>
    <h1>KharchBook</h1>
  </header>

  <!-- ===== SCREEN 1: DASHBOARD ===== -->
  <main id="dashboard-screen" class="screen">

    <section class="balance-card">      
      <p class="balance-label">Balance</p>    
      <p class="balance-amount" id="balance-amount">₹0</p>       
      <p class="balance-sub" id="balance-sub">Income ₹0 − Spent ₹0</p>    
    </section>   
    <section class="summary-cards">
      <div class="card">
        <p class="card-label">Today</p>
        <p class="card-amount">₹0</p>
      </div>
      <div class="card">
        <p class="card-label">This Week</p>
        <p class="card-amount">₹0</p>
      </div>
      <div class="card">
        <p class="card-label">This Month</p>
        <p class="card-amount">₹0</p>
      </div>
    </section>

    <section class="category-breakdown">
      <h2>Category-wise Spending</h2>
      <div id="category-breakdown-container"></div>
    </section>

    <section class="recent-expenses">
      <h2>Recent Expenses</h2>
      <p class="empty-text">No expenses yet. Tap + to add one.</p>
    </section>

    <button id="export-btn" class="secondary-btn">⬇ Export All Data (CSV)</button>

  </main>

  <!-- ===== SCREEN 2: ADD EXPENSE ===== -->
  <main id="add-expense-screen" class="screen hidden">

    <div class="screen-header">
      <button id="back-btn" class="text-btn">&larr; Back</button>
      <h2 id="form-title">Add Expense</h2>
    </div>

    <form id="expense-form">
      <label for="entry-type">Type</label>
      <select id="entry-type">
        <option value="expense">💸 Expense</option>
        <option value="income">💰 Income</option>
      </select>

      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" placeholder="0" min="0.01" step="0.01" required>

      <label for="category">Category</label>
      <select id="category">
        <option value="Food">🍕 Food</option>
        <option value="Travel">🚗 Travel</option>
        <option value="Shopping">🛍️ Shopping</option>
        <option value="Bills">🧾 Bills</option>
        <option value="Medical">💊 Medical</option>
        <option value="Entertainment">🎬 Entertainment</option>
        <option value="Other">📌 Other</option>
      </select>

      <label for="date">Date</label>
      <input type="date" id="date" required>

      <label for="note">Note (optional)</label>
      <input type="text" id="note" placeholder="e.g. Lunch with friends">

      <label for="payment-method">Payment Method</label>
      <select id="payment-method">
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
        <option value="Card">Card</option>
        <option value="Bank">Bank</option>
      </select>

      <button type="submit" class="primary-btn">Save Expense</button>
      <button type="button" id="delete-btn" class="delete-btn hidden">Delete Expense</button>
    </form>

  </main>

  <!-- Floating + button to open Add Expense screen -->
  
<!-- ===== SCREEN 3: EXPENSE LIST ===== -->
  <main id="list-screen" class="screen hidden">
    <h2 class="list-title">All Expenses</h2>

    <input type="text" id="search-input" placeholder="Search by note...">

    <div class="filter-row">
      <select id="filter-category">
        <option value="">All Categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Medical">Medical</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <input type="date" id="filter-date">
    </div>

    <button id="clear-filters-btn" class="text-btn">Clear Filters</button>

    <div id="expense-list-container"></div>
  </main>

  <!-- ===== SCREEN 4: STATISTICS ===== -->
  <main id="stats-screen" class="screen hidden">
    <h2 class="list-title">Spending by Category</h2>
    <div id="stats-chart-container"></div>
  </main>

  <button id="add-btn" class="fab">+</button>

  <nav class="bottom-nav">
    <button id="nav-dashboard" class="nav-btn active">Dashboard</button>
    <button id="nav-list" class="nav-btn">Expenses</button>
    <button id="nav-stats" class="nav-btn">Stats</button>
  </nav>

  <!-- ===== SIDE MENU ===== -->
  <div id="side-menu-overlay" class="side-menu-overlay hidden"></div>
  <nav id="side-menu" class="side-menu hidden">
    <div class="side-menu-profile" id="side-menu-profile">
      <div class="profile-avatar">👤</div>
      <p class="side-menu-name" id="side-menu-name">Tap to set your name</p>
      <p class="side-menu-email" id="side-menu-email">Tap to add email</p>
    </div>

    <div class="side-menu-footer">
      <button id="menu-share-btn" class="menu-item-btn">📤 Share App</button>
      <button id="menu-rate-btn" class="menu-item-btn">⭐ Rate App</button>
      <button id="menu-logout-btn" class="menu-item-btn">🔄 Reset Profile</button>
      <button id="menu-exit-btn" class="menu-item-btn">🚪 Exit</button>
    </div>
  </nav>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
