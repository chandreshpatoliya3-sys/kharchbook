<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KharchBook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar with app name -->
  <header class="app-header">
    <h1>KharchBook</h1>
  </header>

  <!-- ===== SCREEN 1: DASHBOARD ===== -->
  <main id="dashboard-screen" class="screen">

    <section class="summary-cards">
      <div class="card">
        <p class="card-label">Today</p>
        <p class="card-amount">₹0</p>
      </div>
      <div class="card">
        <p class="card-label">This Week</p>
        <p class="card-amount">₹0</p>
      </div>
      <div class="card">
        <p class="card-label">This Month</p>
        <p class="card-amount">₹0</p>
      </div>
    </section>

    <section class="recent-expenses">
      <h2>Recent Expenses</h2>
      <p class="empty-text">No expenses yet. Tap + to add one.</p>
    </section>

  </main>

  <!-- ===== SCREEN 2: ADD EXPENSE ===== -->
  <main id="add-expense-screen" class="screen hidden">

    <div class="screen-header">
      <button id="back-btn" class="text-btn">&larr; Back</button>
      <h2 id="form-title">Add Expense</h2>
    </div>

    <form id="expense-form">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" placeholder="0" required>

      <label for="category">Category</label>
      <select id="category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Medical">Medical</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <label for="date">Date</label>
      <input type="date" id="date" required>

      <label for="note">Note (optional)</label>
      <input type="text" id="note" placeholder="e.g. Lunch with friends">

      <label for="payment-method">Payment Method</label>
      <select id="payment-method">
        <option value="Cash">Cash</option>
        <option value="UPI">UPI</option>
        <option value="Card">Card</option>
        <option value="Bank">Bank</option>
      </select>

      <button type="submit" class="primary-btn">Save Expense</button>
      <button type="button" id="delete-btn" class="delete-btn hidden">Delete Expense</button>
    </form>

  </main>

  <!-- Floating + button to open Add Expense screen -->
  
<!-- ===== SCREEN 3: EXPENSE LIST ===== -->
  <main id="list-screen" class="screen hidden">
    <h2 class="list-title">All Expenses</h2>

    <input type="text" id="search-input" placeholder="Search by note...">

    <div class="filter-row">
      <select id="filter-category">
        <option value="">All Categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Medical">Medical</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <input type="date" id="filter-date">
    </div>

    <button id="clear-filters-btn" class="text-btn">Clear Filters</button>

    <div id="expense-list-container"></div>
  </main>

  <button id="add-btn" class="fab">+</button>

  <nav class="bottom-nav">
    <button id="nav-dashboard" class="nav-btn active">Dashboard</button>
    <button id="nav-list" class="nav-btn">Expenses</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
